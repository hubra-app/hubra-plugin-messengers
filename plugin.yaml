description: "Announcements in the club's Telegram, Signal or Matrix group: new events, posts and polls, and reminders."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-messengers
license: AGPL-3.0-or-later
tags: [communication, telegram, signal, matrix]
package: hubra_messengers
modules: [messengers]
requires: [members]
migrations: migrations
